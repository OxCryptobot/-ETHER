name: autonomy-host

on:
  workflow_dispatch:
    inputs:
      action:
        description: "ensure | selftest | health | cycle | boot"
        required: true
        default: "cycle"
        type: choice
        options:
          - ensure
          - selftest
          - health
          - cycle
          - boot

concurrency:
  group: autonomy-host
  cancel-in-progress: false

jobs:
  host:
    runs-on: [self-hosted, Windows, ETHER]
    timeout-minutes: 360
    env:
      ETHER_ROOT: C:\\Users\\Otcde\\ETHER
      GIT_TERMINAL_PROMPT: "0"
      GCM_INTERACTIVE: Never
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout (control scripts)
        uses: actions/checkout@v4

      - name: Soft sync REAL install at ETHER_ROOT
        run: |
          $root = $env:ETHER_ROOT
          if (-not (Test-Path $root)) { throw "ETHER_ROOT missing: $root" }
          Set-Location $root
          git merge --abort
          git rebase --abort
          $unmerged = @(git diff --name-only --diff-filter=U)
          foreach ($f in $unmerged) {
            $n = ($f -replace '\\','/')
            if ($n -like "artifacts/jobs/*") {
              git checkout --ours -- $f
              if ($LASTEXITCODE -ne 0) { git rm -f -- $f } else { git add -- $f }
            }
          }
          $still = @(git diff --name-only --diff-filter=U)
          if ($still.Count -gt 0) { throw "unmerged outside job queue: $($still -join ', ')" }
          git fetch origin
          git pull --ff-only origin main
          if ($LASTEXITCODE -ne 0) {
            git stash push -u -m "autonomy-host"
            git pull --rebase origin main
            if ($LASTEXITCODE -ne 0) {
              git rebase --abort
              throw "rebase failed; worktree was not reset"
            }
            git stash pop
            if ($LASTEXITCODE -ne 0) { throw "stash pop conflict; worktree was not reset" }
          }
          if (-not (Test-Path .\\.venv\\Scripts\\python.exe)) {
            python -m venv .venv
            .\\.venv\\Scripts\\python.exe -m pip install -U pip
          }
          .\\.venv\\Scripts\\python.exe -m pip install -e ".[dev]" -q

      - name: Disk LIVE tick (no Matrix UI)
        run: |
          Set-Location $env:ETHER_ROOT
          $root = $env:ETHER_ROOT
          $py = Join-Path $root ".venv\Scripts\python.exe"
          function Invoke-Tick {
            $proc = Start-Process -FilePath $py -ArgumentList "scripts/host_main.py" -WorkingDirectory $root -WindowStyle Hidden -PassThru
            if (-not $proc.WaitForExit(180000)) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              Set-Content -Path (Join-Path $root "artifacts\tick_timeout.json") -Value '{"ok":false,"error":"tick_timeout"}'
            }
          }
          Invoke-Tick
          while ($true) {
            Start-Sleep -Seconds 60
            Invoke-Tick
          }

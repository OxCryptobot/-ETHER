name: autonomy-host

on:
  workflow_dispatch:
    inputs:
      action:
        description: "ensure or cycle"
        required: true
        default: "cycle"
        type: choice
        options:
          - ensure
          - cycle
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: autonomy-host
  cancel-in-progress: true

jobs:
  host:
    runs-on: [self-hosted, Windows, ETHER]
    timeout-minutes: 10
    env:
      ETHER_ROOT: C:\\Users\\Otcde\\ETHER
      GIT_TERMINAL_PROMPT: "0"
      GCM_INTERACTIVE: Never
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout (control scripts)
        uses: actions/checkout@v4

      - name: One tick
        run: |
          $ErrorActionPreference = "Continue"
          $env:PYTHONPATH = $env:GITHUB_WORKSPACE
          $env:GIT_TERMINAL_PROMPT = "0"
          $env:GCM_INTERACTIVE = "Never"
          $env:ETHER_FIXTURE = "fixtures/repo_oracle_merge"
          Remove-Item Env:ETHER_REPO_FILE -ErrorAction SilentlyContinue
          Set-Location $env:GITHUB_WORKSPACE
          foreach ($name in @("repo_oracle_toy","repo_oracle_merge")) {
            $src = Join-Path $env:GITHUB_WORKSPACE "fixtures\$name"
            $dst = Join-Path $env:ETHER_ROOT "fixtures\$name"
            if (Test-Path $src) { Copy-Item -Recurse -Force $src $dst }
          }
          $py = Join-Path $env:ETHER_ROOT ".venv\Scripts\python.exe"
          if (-not (Test-Path $py)) { throw "venv python missing: $py" }
          & $py -u scripts/host_main.py
          Write-Host "EXIT $LASTEXITCODE"
          Write-Host "--- app_alive ---"
          Get-Content (Join-Path $env:ETHER_ROOT "artifacts\app_alive.json") -ErrorAction SilentlyContinue
          Write-Host "--- git_push ---"
          Get-Content (Join-Path $env:ETHER_ROOT "artifacts\git_push.json") -ErrorAction SilentlyContinue

name: autonomy-host

on:
  workflow_dispatch:
    inputs:
      action:
        description: "ensure | selftest | health | cycle | boot"
        required: true
        default: "cycle"
        type: choice
        options:
          - ensure
          - selftest
          - health
          - cycle
          - boot

concurrency:
  group: autonomy-host
  cancel-in-progress: false

jobs:
  host:
    runs-on: [self-hosted, Windows, ETHER]
    timeout-minutes: 360
    env:
      ETHER_ROOT: C:\\Users\\Otcde\\ETHER
      GIT_TERMINAL_PROMPT: "0"
      GCM_INTERACTIVE: Never
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout (control scripts)
        uses: actions/checkout@v4

      - name: Soft sync REAL install at ETHER_ROOT
        run: |
          $root = $env:ETHER_ROOT
          if (-not (Test-Path $root)) { throw "ETHER_ROOT missing: $root" }
          Set-Location $root
          $env:GIT_TERMINAL_PROMPT = "0"
          $env:GCM_INTERACTIVE = "Never"
          $env:GIT_CONFIG_COUNT = "1"
          $env:GIT_CONFIG_KEY_0 = "credential.helper"
          $env:GIT_CONFIG_VALUE_0 = ""
          try {
            $tok = (gh auth token).Trim()
            if ($tok) {
              $env:GIT_CONFIG_COUNT = "2"
              $env:GIT_CONFIG_KEY_1 = "http.extraheader"
              $env:GIT_CONFIG_VALUE_1 = "AUTHORIZATION: bearer $tok"
            }
          } catch {}
          Get-CimInstance Win32_Process -Filter "Name='git.exe'" -ErrorAction SilentlyContinue |
            Where-Object { $_.CommandLine -match 'Otcde\\ETHER' } |
            ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          Start-Sleep -Seconds 1
          Remove-Item (Join-Path $root ".git\index.lock") -Force -ErrorAction SilentlyContinue
          function Invoke-Git([string[]]$argv) {
            for ($i = 0; $i -lt 6; $i++) {
              $lock = Join-Path (Get-Location) ".git\index.lock"
              if (Test-Path $lock) {
                $age = ((Get-Date) - (Get-Item $lock).LastWriteTime).TotalSeconds
                if ($age -gt 30) { Remove-Item $lock -Force -ErrorAction SilentlyContinue }
                else { Start-Sleep -Seconds 3; continue }
              }
              & git @argv
              if ($LASTEXITCODE -eq 0) { return }
              Start-Sleep -Seconds 2
            }
          }
          git merge --abort
          git rebase --abort
          $unmerged = @(git diff --name-only --diff-filter=U)
          foreach ($f in $unmerged) {
            $n = ($f -replace '\\','/')
            if ($n -like "artifacts/jobs/*") {
              git checkout --ours -- $f
              if ($LASTEXITCODE -ne 0) { git rm -f -- $f } else { git add -- $f }
            }
          }
          $still = @(git diff --name-only --diff-filter=U)
          if ($still.Count -gt 0) { throw "unmerged outside job queue: $($still -join ', ')" }
          Invoke-Git fetch, origin
          git pull --ff-only origin main
          if ($LASTEXITCODE -ne 0) {
            git stash push -u -m "autonomy-host"
            Invoke-Git pull, --rebase, origin, main
            if ($LASTEXITCODE -ne 0) { git rebase --abort }
            git stash pop
          }
          git fetch origin main
          git checkout origin/main -- scripts core
          if (-not (Test-Path .\\.venv\\Scripts\\python.exe)) {
            python -m venv .venv
            .\\.venv\\Scripts\\python.exe -m pip install -U pip
          }
          .\\.venv\\Scripts\\python.exe -m pip install -e ".[dev]" -q

      - name: One heartbeat
        run: |
          Set-Location $env:ETHER_ROOT
          $py = Join-Path $env:ETHER_ROOT ".venv\Scripts\python.exe"
          & $py -u scripts/host_main.py
          Write-Host "EXIT $LASTEXITCODE"
          Write-Host "--- app_alive ---"
          Get-Content (Join-Path $env:ETHER_ROOT "artifacts\app_alive.json") -ErrorAction SilentlyContinue
          Write-Host "--- git_push ---"
          Get-Content (Join-Path $env:ETHER_ROOT "artifacts\git_push.json") -ErrorAction SilentlyContinue

      - name: Keep ticking
        run: |
          Set-Location $env:ETHER_ROOT
          $root = $env:ETHER_ROOT
          $py = Join-Path $root ".venv\Scripts\python.exe"
          function Invoke-Tick {
            $log = Join-Path $root "artifacts\tick_log.txt"
            $err = Join-Path $root "artifacts\tick_err.txt"
            $proc = Start-Process -FilePath $py -ArgumentList "-u","scripts/host_main.py" -WorkingDirectory $root -WindowStyle Hidden -RedirectStandardOutput $log -RedirectStandardError $err -PassThru
            if (-not $proc.WaitForExit(120000)) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              Set-Content -Path (Join-Path $root "artifacts\tick_timeout.json") -Value '{"ok":false,"error":"tick_timeout"}'
            }
          }
          while ($true) {
            Start-Sleep -Seconds 90
            Invoke-Tick
          }

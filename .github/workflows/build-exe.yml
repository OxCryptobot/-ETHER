name: build-exe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pyinstaller
        run: |
          pip install -q pyinstaller
          pyinstaller ether_app.spec --noconfirm --clean
      - uses: actions/upload-artifact@v4
        with:
          name: ETHER-exe
          path: scripts/dist/ETHER.exe

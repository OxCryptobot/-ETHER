name: matrix-worker
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"
  push:
    branches: [main]
    paths:
      - "core/**"
      - "tests/test_kernel_*.py"
      - "tests/test_drain_fast_fifo.py"
      - "tests/test_live_host.py"
      - "tests/test_live_status.py"
      - "tests/test_evolve.py"
      - "tests/test_ether_keepalive.py"
      - "tests/test_daemon_publish.py"
      - "tests/test_host_pid.py"
      - "tests/test_citrine_health.py"
      - "scripts/drain_fast_fifo.py"
      - "scripts/ether_keepalive.py"
      - "scripts/ether_daemon.py"
      - "scripts/origin_publish.py"
      - "scripts/host_main.py"
      - "scripts/unison.py"
      - "scripts/ether_app.py"
      - "tests/test_unison.py"
      - "tests/test_publish_sync.py"
      - "scripts/runner_register.py"
      - "scripts/self_heal.py"
      - "scripts/skills.py"
      - "tests/test_skills.py"
      - "tests/test_runner_register.py"
      - "scripts/drain_live_fifo.py"
      - "scripts/ether_week_tick.py"
      - "scripts/ether_evolve.py"
      - "scripts/live_host.py"
      - "scripts/live_status.py"
      - ".github/workflows/matrix-worker.yml"
      - "artifacts/jobs/pending/**"
permissions:
  contents: read
  actions: read
jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: FAST deps
        run: pip install -q pytest pydantic pyyaml httpx
      - name: Targeted kernel gates
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest tests/test_kernel_phase1.py tests/test_kernel_phase2.py tests/test_kernel_phase3.py tests/test_kernel_phase4.py tests/test_kernel_phase5.py tests/test_kernel_phase6.py tests/test_drain_fast_fifo.py tests/test_live_host.py tests/test_live_status.py tests/test_evolve.py tests/test_gem_topo.py tests/test_ether_keepalive.py tests/test_daemon_publish.py tests/test_host_pid.py tests/test_citrine_health.py tests/test_runner_register.py tests/test_skills.py tests/test_publish_sync.py tests/test_unison.py -q --tb=line
      - name: Drain FAST FIFO
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/drain_fast_fifo.py
      - name: Observe only
        run: |
          echo "matrix-worker does not commit. the exe is the only writer."

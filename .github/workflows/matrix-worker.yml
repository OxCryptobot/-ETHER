name: matrix-worker
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "core/**"
      - "tests/test_*.py"
      - "scripts/deploy_pipeline.py"
      - ".github/workflows/matrix-worker.yml"
jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: FAST deps
        run: pip install -q pytest pydantic pyyaml httpx
      - name: Deploy pipeline + gems
        run: |
          python scripts/deploy_pipeline.py
          python -m pytest tests/test_agentic.py tests/test_gem_topo.py -q --tb=short

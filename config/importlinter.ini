# import-linter contracts backing the ARCH rules (P2 §2).
# Dev-only dependency — nothing enters runtime deps (F1/S-08).
# Install: pip install import-linter ; run: lint-imports --config config/importlinter.ini

[importlinter]
root_package = ether
include_external_packages = True

# (a) core must not import gems (ARCH-001) — post-migration target is a
# composition root; until then ARCH-001's baselined site is grandfathered
# by the AST runner, and this contract guards NEW code.
[importlinter:contract:core-not-gems]
name = core must not import gems (ARCH-001, A-4/R1)
type = forbidden
source_modules =
    core
forbidden_modules =
    gems
ignore_imports =
    # Grandfathered at HEAD 208993a — remove as the registry moves to a
    # composition root (see findings_baseline.json ARCH-001 entries).
    core.registry -> gems.clear_quartz.sandbox
    core.registry -> gems.rose_quartz.router
    core.registry -> gems.selenite.planner
    core.registry -> gems.black_tourmaline.security
    core.registry -> gems.labradorite.profiler
    core.registry -> gems.amethyst.evolution
    core.registry -> gems.grandidierite.extension
    core.pipeline -> gems.grandidierite.registry
    core.pipeline -> gems.clear_quartz.sandbox
    core.health_check -> gems.clear_quartz.sandbox
    core.holdout -> gems.clear_quartz.sandbox
    core.tool_reconcile -> gems.grandidierite.fabricate
    core.verifier -> gems.clear_quartz.sandbox

# (b) gems must not import core.pipeline / higher layers (ARCH-002).
# Leaf contracts are legal: core.schemas, core.config, core.pipeline_hooks,
# core.learning.
[importlinter:contract:gems-not-core-pipeline]
name = gems must not import core.pipeline (ARCH-002, A-4/A-1)
type = forbidden
source_modules =
    gems
forbidden_modules =
    core.pipeline
    core.agent_loop
    core.orchestrator
    cli
    dashboard
    scripts
ignore_imports =
    gems.clear_quartz.sandbox -> core.pipeline_hooks

# (c) tools/persistent is reachable only via the gem registry — no direct
# imports anywhere else in the codebase.
[importlinter:contract:persistent-via-registry]
name = tools.persistent only reachable via gems.grandidierite.registry
type = forbidden
source_modules =
    core
    cli
    dashboard
    scripts
    gems.amethyst
    gems.black_tourmaline
    gems.citrine
    gems.clear_quartz
    gems.labradorite
    gems.rose_quartz
    gems.selenite
forbidden_modules =
    tools.persistent

# Layering: cli/scripts are the top, core the middle, gems the plugins.
[importlinter:contract:layers]
name = layered cli/scripts -> core -> gems (plugins via registry)
type = layers
layers =
    cli | scripts | dashboard
    core
    gems
containers =
    ether

# Dashboard reads memory/ only through the collector (ARCH-004, A-7/P-05):
# the AST rule enforces the I/O side; this contract bars dashboard from
# reaching core.pipeline directly.
[importlinter:contract:dashboard-independence]
name = dashboard independent of core.pipeline (ARCH-004 support)
type = independence
modules =
    dashboard
    core.pipeline

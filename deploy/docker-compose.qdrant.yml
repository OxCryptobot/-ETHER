# Citrine memory backend — required for Stage 2 Modular Intelligence.
#
#   docker compose -f deploy/docker-compose.qdrant.yml up -d
#
# Health: http://localhost:6333/healthz
# Dashboard (optional): http://localhost:6333/dashboard

services:
  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: ether-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ether_qdrant_data:/qdrant/storage
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333

volumes:
  ether_qdrant_data:

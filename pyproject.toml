[project]
name = "ether"
version = "0.2.1"
description = "@ETHER — Local-first super-agentic coding system with verified execution"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "OxCryptobot" }]
keywords = ["llm", "coding-agent", "local-ai", "sandbox", "ollama"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]

dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "qdrant-client>=1.9",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]
mcp = [
    "mcp[cli]>=1.0",
]

[project.scripts]
ether = "cli.main:main"

[project.urls]
Homepage = "https://github.com/OxCryptobot/-ETHER"
Repository = "https://github.com/OxCryptobot/-ETHER"
Issues = "https://github.com/OxCryptobot/-ETHER/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "gems", "cli", "dashboard"]

[tool.hatch.build]
include = [
    "config/manifest.yaml",
    "STATUS.md",
    "README.md",
    "dashboard/static/index.html",
    "docs/QUICKSTART.md",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

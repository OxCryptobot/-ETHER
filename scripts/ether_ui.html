<!doctype html>
<html><head><meta charset="utf-8"/><title>ETHER</title>
<style>
:root{--bg:#0e1116;--fg:#e6edf3;--muted:#8b949e;--line:#30363d;--acc:#3fb950;--card:#161b22}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:13px/1.45 ui-sans-serif,system-ui}
#app{display:grid;grid-template-rows:48px 1fr 44px;height:100%}
header{display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--line)}
h1{font-size:13px;letter-spacing:.16em;margin:0}
.btn{background:#21262d;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
#mid{display:grid;grid-template-columns:220px 1fr 1fr;min-height:0}
aside,main,section{border-right:1px solid var(--line);overflow:auto;padding:10px}
section{border-right:0}
.k{color:var(--muted);font-size:10px;letter-spacing:.12em}
.file{display:block;padding:3px 0;color:#79c0ff;cursor:pointer;font-family:ui-monospace,monospace;font-size:12px}
pre{white-space:pre-wrap;font:12px/1.4 ui-monospace,monospace;margin:8px 0}
#chatlog{min-height:200px}
footer{display:flex;gap:8px;padding:6px 10px;border-top:1px solid var(--line)}
footer input{flex:1;background:#0d1117;border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:8px}
.pill{margin-left:auto;font-family:ui-monospace,monospace;font-size:11px;color:var(--acc)}
</style></head>
<body>
<div id="app">
<header>
  <h1>ETHER</h1>
  <button class="btn" onclick="post('/start')">Start LIVE</button>
  <button class="btn" onclick="post('/stop')">Stop LIVE</button>
  <button class="btn" onclick="post('/run')">Run tests</button>
  <span class="pill" id="stat">…</span>
</header>
<div id="mid">
<aside><div class="k">FILES</div><div id="files"></div></aside>
<main><div class="k">EDITOR</div><pre id="ed">select a file</pre></main>
<section>
  <div class="k">AGENT</div>
  <div id="chatlog"></div>
</section>
</div>
<footer>
  <input id="q" placeholder="Ask ETHER to work in this repo…" onkeydown="if(event.key==='Enter')ask()"/>
  <button class="btn" onclick="ask()">Send</button>
</footer>
</div>
<script>
async function j(u,opt){const r=await fetch(u,opt);return r.json()}
async function health(){
  const h=await j('/health');
  document.getElementById('stat').textContent=(h.ollama?'OLLAMA UP':'OLLAMA DOWN')+' · '+(h.live_lane||'—');
}
async function files(){
  const d=await j('/files');
  document.getElementById('files').innerHTML=(d.files||[]).map(f=>`<span class="file" onclick="openf('${f}')">${f}</span>`).join('');
}
async function openf(p){
  const d=await j('/read?path='+encodeURIComponent(p));
  document.getElementById('ed').textContent=d.text||d.error||'';
}
async function post(p){const d=await j(p,{method:'POST'}); note(JSON.stringify(d)); health()}
async function ask(){
  const q=document.getElementById('q'); const t=q.value.trim(); if(!t)return; q.value='';
  note('you: '+t);
  const d=await j('/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t})});
  note('ether: '+(d.reply||d.tail||JSON.stringify(d)));
}
function note(s){const el=document.getElementById('chatlog'); el.textContent += s+'\n\n'}
health(); files(); setInterval(health,5000);
</script>
</body></html>

<!doctype html>
<html><head><meta charset="utf-8"/><title>ETHER Control Matrix</title>
<style>
:root{--bg:#07080a;--fg:#e8eaed;--muted:#8b939e;--line:#2a2f36;--acc:#3dd68c;--card:#10141a}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:13px/1.45 ui-sans-serif,system-ui}
#app{display:grid;grid-template-rows:52px 72px 1fr 48px;height:100%}
header{display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line);letter-spacing:.12em}
h1{font-size:13px;margin:0;font-weight:650}
.btn{min-height:36px;padding:0 12px;border:0;border-radius:4px;background:#1c2229;color:var(--fg);cursor:pointer}
.rail{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
.card{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--card)}
.k{font-size:9px;letter-spacing:.14em;color:var(--muted)}
.v{font:600 16px ui-monospace,monospace;margin-top:2px}
.ok{color:var(--acc)}
#mid{display:grid;grid-template-columns:1fr 1fr;min-height:0}
.pane{border-right:1px solid var(--line);padding:12px;overflow:auto}
.pane:last-child{border-right:0}
pre{white-space:pre-wrap;font:12px/1.45 ui-monospace,monospace;color:var(--muted)}
footer{display:flex;gap:8px;padding:8px 12px;border-top:1px solid var(--line)}
footer input{flex:1;background:#0d1117;border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:8px}
</style></head>
<body>
<div id="app">
<header>
  <h1>ETHER CONTROL MATRIX</h1>
  <button class="btn" onclick="post('/start')">Start LIVE</button>
  <button class="btn" onclick="post('/stop')">Stop LIVE</button>
  <button class="btn" onclick="post('/run')">Run tests</button>
  <button class="btn" onclick="post('/update')">Update exe</button>
  <span class="k" id="stamp">local · no xAI</span>
</header>
<section class="rail">
  <div class="card"><div class="k">OLLAMA</div><div class="v" id="ollama">—</div></div>
  <div class="card"><div class="k">LIVE LANE</div><div class="v" id="lane">—</div></div>
  <div class="card"><div class="k">UPDATED</div><div class="v" id="updated">—</div></div>
  <div class="card"><div class="k">TASKS</div><div class="v" id="tn">—</div></div>
  <div class="card"><div class="k">HOST</div><div class="v">1650</div></div>
</section>
<div id="mid">
  <div class="pane"><div class="k">HOST 4B</div><pre id="hostlog">local model + tools</pre></div>
  <div class="pane"><div class="k">GROK / MATRIX</div><pre id="tasks">task board</pre></div>
</div>
<footer>
  <input id="q" placeholder="Ask the local agent…" onkeydown="if(event.key==='Enter')ask()"/>
  <button class="btn" onclick="ask()">Send</button>
</footer>
</div>
<script>
async function j(u,o){const r=await fetch(u,o);return r.json()}
async function health(){
  const h=await j('/health');
  document.getElementById('ollama').textContent=h.ollama?'UP':'DOWN';
  document.getElementById('ollama').className='v'+(h.ollama?' ok':'');
  document.getElementById('lane').textContent=h.live_lane||'—';
  document.getElementById('updated').textContent=(h.updated||'').slice(11,19)||'—';
  document.getElementById('hostlog').textContent=JSON.stringify(h,null,2);
  try{
    const t=await j('/tasks');
    const list=t.tasks||[];
    document.getElementById('tn').textContent=String(list.length);
    document.getElementById('tasks').textContent=list.slice(-12).map(x=> (x.status||'')+'  '+(x.title||x.id)).join('\\n')||'no tasks';
  }catch(e){}
}
async function post(p){const d=await j(p,{method:'POST'}); document.getElementById('hostlog').textContent=JSON.stringify(d,null,2); health()}
async function ask(){
  const q=document.getElementById('q'); const t=q.value.trim(); if(!t)return; q.value='';
  const d=await j('/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t})});
  document.getElementById('hostlog').textContent=JSON.stringify(d,null,2);
  health();
}
health(); setInterval(health,4000);
</script>
</body></html>

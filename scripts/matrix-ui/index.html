<!doctype html>
<html><head><meta charset="utf-8"/><title>ETHER Control Matrix</title>
<link rel="stylesheet" href="/matrix.css"/></head>
<body>
<div id="app">
<header>
  <h1>ETHER CONTROL MATRIX</h1>
  <span class="chip">READ ONLY</span>
  <span class="chip" id="stamp">watching</span>
</header>
<section class="rail">
  <div class="card"><div class="k">OLLAMA</div><div class="v" id="ollama">—</div></div>
  <div class="card"><div class="k">TASK</div><div class="v" id="task">—</div></div>
  <div class="card"><div class="k">HONEST</div><div class="v" id="honest">—</div></div>
  <div class="card"><div class="k">FILE</div><div class="v" id="file">—</div></div>
  <div class="card"><div class="k">ALIVE</div><div class="v" id="alive">—</div></div>
  <div class="card"><div class="k">QUEUE</div><div class="v" id="qn">—</div></div>
</section>
<div id="mid">
  <div class="pane">
    <div class="ph">HANDS — EXE WRITES</div>
    <pre id="left">waiting…</pre>
  </div>
  <div class="pane">
    <div class="ph">GROWTH QUEUE</div>
    <div id="queue"></div>
    <pre id="assert"></pre>
  </div>
</div>
<footer>
  <span class="chip">Matrix watches. The exe writes. This page does not.</span>
</footer>
</div>
<script src="/matrix.js"></script>
</body></html>

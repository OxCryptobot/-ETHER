<!doctype html>
<html><head><meta charset="utf-8"/><title>ETHER</title>
<link rel="stylesheet" href="/matrix.css"/></head>
<body>
<div id="app">
<header>
  <h1>ETHER</h1>
  <span class="dot" id="dot"></span>
  <span class="stat" id="stat">starting…</span>
  <button onclick="post('/start')">Start</button>
  <button onclick="post('/stop')" style="background:#3a3834;color:#f5f2eb">Stop</button>
</header>
<aside>
  <h2>Tasks</h2>
  <div id="board"></div>
</aside>
<section id="chat">
  <div class="msg"><div class="who">System</div><div class="bubble" id="left">Local Cowork. 4B on this machine. Ask in the box below.</div></div>
</section>
<aside id="right">
  <h2>Queue</h2>
  <div id="queue"></div>
  <h2>Status</h2>
  <div class="item" id="meta">—</div>
</aside>
<footer>
  <input id="q" placeholder="What should ETHER do?" onkeydown="if(event.key==='Enter')ask()"/>
  <button onclick="ask()">Send</button>
</footer>
</div>
<script src="/matrix.js"></script>
</body></html>
